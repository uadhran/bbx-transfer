name: ci

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --all
      - name: build release
        run: cargo build --release
      - name: smoke cleartext + encrypted
        run: |
          set -euo pipefail
          BIN=./target/release/bbx
          dd if=/dev/urandom of=/tmp/bbx-in.bin bs=1M count=8 status=none
          # cleartext
          rm -f /tmp/bbx-out.bin /tmp/bbx-port.txt
          $BIN sink -l 127.0.0.1:0 -o /tmp/bbx-out.bin -s 4 -c -E > /tmp/bbx-port.txt &
          SPID=$!
          for i in $(seq 1 50); do test -s /tmp/bbx-port.txt && break; sleep 0.05; done
          PORT=$(awk '/^PORT/{print $2; exit}' /tmp/bbx-port.txt)
          $BIN source -a "127.0.0.1:$PORT" -i /tmp/bbx-in.bin -s 4 -c -E -P 1
          wait $SPID
          cmp /tmp/bbx-in.bin /tmp/bbx-out.bin
          # encrypted (KEY banner)
          rm -f /tmp/bbx-out2.bin /tmp/bbx-port2.txt
          $BIN sink -l 127.0.0.1:0 -o /tmp/bbx-out2.bin -s 4 -c -e > /tmp/bbx-port2.txt &
          SPID=$!
          for i in $(seq 1 50); do grep -q '^KEY ' /tmp/bbx-port2.txt 2>/dev/null && break; sleep 0.05; done
          PORT=$(awk '/^PORT/{print $2; exit}' /tmp/bbx-port2.txt)
          KEY=$(awk '/^KEY /{print $2; exit}' /tmp/bbx-port2.txt)
          $BIN source -a "127.0.0.1:$PORT" -i /tmp/bbx-in.bin -s 4 -c -e -k "$KEY" -P 1
          wait $SPID
          cmp /tmp/bbx-in.bin /tmp/bbx-out2.bin
          # resume (requires -c / BLAKE3)
          dd if=/tmp/bbx-in.bin of=/tmp/bbx-part.bin bs=1M count=2 status=none
          $BIN sink -l 127.0.0.1:0 -o /tmp/bbx-part.bin -s 4 -c -E -A > /tmp/bbx-port3.txt &
          SPID=$!
          for i in $(seq 1 50); do grep -q '^RESUME ' /tmp/bbx-port3.txt 2>/dev/null && break; sleep 0.05; done
          PORT=$(awk '/^PORT/{print $2; exit}' /tmp/bbx-port3.txt)
          RF=$(awk '/^RESUME/{print $2; exit}' /tmp/bbx-port3.txt)
          $BIN source -a "127.0.0.1:$PORT" -i /tmp/bbx-in.bin -s 4 -c -E -R "$RF"
          wait $SPID
          cmp /tmp/bbx-in.bin /tmp/bbx-part.bin
          # max streams (C1)
          rm -f /tmp/bbx-out64.bin /tmp/bbx-port64.txt
          $BIN sink -l 127.0.0.1:0 -o /tmp/bbx-out64.bin -s 64 -C -E > /tmp/bbx-port64.txt &
          SPID=$!
          for i in $(seq 1 50); do test -s /tmp/bbx-port64.txt && break; sleep 0.05; done
          PORT=$(awk '/^PORT/{print $2; exit}' /tmp/bbx-port64.txt)
          $BIN source -a "127.0.0.1:$PORT" -i /tmp/bbx-in.bin -s 64 -C -E
          wait $SPID
          cmp /tmp/bbx-in.bin /tmp/bbx-out64.bin
          # empty file (must transfer, not silently skip)
          rm -f /tmp/bbx-empty.in /tmp/bbx-empty.out /tmp/bbx-porte.txt
          : > /tmp/bbx-empty.in
          $BIN sink -l 127.0.0.1:0 -o /tmp/bbx-empty.out -s 4 -C -E > /tmp/bbx-porte.txt &
          SPID=$!
          for i in $(seq 1 50); do test -s /tmp/bbx-porte.txt && break; sleep 0.05; done
          PORT=$(awk '/^PORT/{print $2; exit}' /tmp/bbx-porte.txt)
          $BIN source -a "127.0.0.1:$PORT" -i /tmp/bbx-empty.in -s 4 -C -E
          wait $SPID
          test -f /tmp/bbx-empty.out
          cmp /tmp/bbx-empty.in /tmp/bbx-empty.out
          # single stream
          rm -f /tmp/bbx-out1.bin /tmp/bbx-port1.txt
          $BIN sink -l 127.0.0.1:0 -o /tmp/bbx-out1.bin -s 1 -c -E > /tmp/bbx-port1.txt &
          SPID=$!
          for i in $(seq 1 50); do test -s /tmp/bbx-port1.txt && break; sleep 0.05; done
          PORT=$(awk '/^PORT/{print $2; exit}' /tmp/bbx-port1.txt)
          $BIN source -a "127.0.0.1:$PORT" -i /tmp/bbx-in.bin -s 1 -c -E
          wait $SPID
          cmp /tmp/bbx-in.bin /tmp/bbx-out1.bin
          # stalled peer must time out, not hang forever
          dd if=/dev/urandom of=/tmp/bbx-big.bin bs=1M count=32 status=none
          python3 -c '
          import socket, time
          srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("127.0.0.1", 0)); srv.listen(8)
          print(srv.getsockname()[1], flush=True)
          conns = [srv.accept()[0] for _ in range(2)]  # accept but never read
          time.sleep(60)
          ' > /tmp/bbx-stall.txt &
          PYPID=$!
          for i in $(seq 1 100); do test -s /tmp/bbx-stall.txt && break; sleep 0.05; done
          PORT=$(head -1 /tmp/bbx-stall.txt)
          # source should fail within the 30s guard, not hang indefinitely
          if BBX_IO_TIMEOUT_SECS=2 timeout 30 $BIN source -a "127.0.0.1:$PORT" -i /tmp/bbx-big.bin -s 2 -C -E; then
            echo "expected source to fail against a stalled peer"; kill $PYPID; exit 1
          fi
          kill $PYPID 2>/dev/null || true
          # listener with no dialer must time out on accept, not hang
          rm -f /tmp/bbx-noconn.out
          if BBX_IO_TIMEOUT_SECS=2 timeout 30 $BIN sink -l 127.0.0.1:0 -o /tmp/bbx-noconn.out -s 2 -C -E; then
            echo "expected sink to fail when no peer connects"; exit 1
          fi

  # C9: publish musl static binary on version tags
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build musl release
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: package
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/bbx
          STAGE=bbx-x86_64-unknown-linux-musl
          mkdir -p dist
          cp "$BIN" "dist/${STAGE}"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          (cd dist && sha256sum "${STAGE}" "${STAGE}.tar.gz" > SHA256SUMS)
      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bbx-x86_64-unknown-linux-musl
            dist/bbx-x86_64-unknown-linux-musl.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
