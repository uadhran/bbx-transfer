[package]
name = "bbx"
version = "0.7.0"
edition = "2021"
description = "Multi-stream bulk copy — BBX2, BLAKE3, encrypt, resume, port range, recursive trees"
license = "MIT"
readme = "README.md"
keywords = ["copy", "transfer", "scp", "bbcp", "network"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
libc = "0.2"
blake3 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
