[package]
name = "bbx"
version = "0.8.1"
edition = "2021"
description = "Multi-stream bulk copy — BBX2, BLAKE3, encrypt, resume, preserve, rate limit"
license = "MIT"
readme = "README.md"
keywords = ["copy", "transfer", "scp", "bbcp", "network"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
blake3 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
